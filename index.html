<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="말없이 같이 앉아 강을 보는 곳, 한강 돗자리">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>한강 돗자리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed 3D river scene, glass pills at the corners, joystick bottom-left, context actions bottom-right. Single dark look over the scene. */
:root{
  --ink:#f4efe6;
  --ink-soft:rgba(244,239,230,.68);
  --glass:rgba(20,26,34,.52);
  --glass-strong:rgba(18,23,30,.82);
  --line:rgba(244,239,230,.16);
  --accent:#f1b26b;
  --accent-ink:#2a1a0b;
  --duck:#ffd54a;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:#121820;color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px}
.hud{position:fixed;z-index:5;display:flex;gap:8px;align-items:flex-start}
.hud-left{top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px))}
.hud-right{top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));flex-direction:column;align-items:flex-end}
.place{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:14px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.place .dim{color:var(--ink-soft)}
.place svg{width:18px;height:18px;flex:none}
.tools{display:flex;align-items:center;gap:2px;padding:4px 6px}
.tool{background:none;border:0;padding:8px 10px;border-radius:999px;display:flex;align-items:center}
.tool:hover{background:rgba(255,255,255,.08)}
.tool svg,.count svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.count{padding:8px 10px 8px 8px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.panel{background:var(--glass-strong);border:1px solid var(--line);border-radius:20px;padding:16px;width:min(290px,calc(100vw - 32px));display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel h3{margin:4px 0 0;font-size:12px;letter-spacing:.12em;color:var(--ink-soft);font-weight:400}
.panel p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(255,255,255,.06);padding:4px;border-radius:12px}
.seg button{border:0;background:none;padding:8px 0;border-radius:9px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.slider{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px;font-size:14px}
.slider input{width:100%;accent-color:var(--accent)}
.chat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chat-grid button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:10px;font-size:14px;display:flex;gap:8px;align-items:center}
.chat-grid button:hover{background:rgba(255,255,255,.12)}
.chat-grid kbd{font-family:inherit;font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.cap{font-size:13px;color:var(--ink-soft)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(241,178,107,.18);color:var(--accent);margin-left:6px;letter-spacing:.04em}

/* bottom controls */
.actions{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100% - 200px)}
.act-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.act{border:1px solid var(--line);background:var(--glass-strong);border-radius:999px;padding:12px 20px;font-size:15px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.act:hover{filter:brightness(1.15)}
.act.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.act.duck{background:var(--duck);color:#3a2a00;border-color:transparent}
.status{font-size:13px;color:var(--ink);padding:7px 14px;text-align:right}
.joy{position:fixed;z-index:6;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:rgba(18,23,30,.38);border:1px solid var(--line);touch-action:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.joy-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(244,239,230,.85);box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none}
.keys{position:fixed;z-index:4;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--ink-soft);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.keys kbd{font-family:inherit;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;color:var(--ink)}
.toast-wrap{position:fixed;z-index:7;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:calc(100% - 32px)}
.toast{padding:9px 16px;font-size:13px;color:var(--ink);animation:fade 4.2s ease forwards;max-width:100%;text-align:center}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}

/* entry */
.gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;background:linear-gradient(180deg,rgba(10,14,20,.05) 0%,rgba(10,14,20,.55) 100%)}
.gate-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.gate-hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,9vw,72px);margin:0;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.gate-hero p{margin:0;color:var(--ink-soft);font-size:16px}
.enter{margin-top:14px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 38px;font-size:17px;box-shadow:0 8px 30px rgba(241,178,107,.35)}
.card{background:var(--glass-strong);border:1px solid var(--line);border-radius:24px;padding:24px;width:min(400px,100%);display:flex;flex-direction:column;gap:20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);max-height:calc(100% - 8px);overflow:auto}
.card h2{font-family:var(--display);font-size:24px;margin:0}
.card .sub{margin:-12px 0 0;color:var(--ink-soft);font-size:14px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font-size:12px;letter-spacing:.12em;color:var(--ink-soft)}
.field input{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);font-size:16px;-webkit-user-select:text;user-select:text}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.choice[aria-pressed="true"]{border-color:var(--accent);background:rgba(241,178,107,.14)}
.choice svg{width:44px;height:44px}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px;font-size:16px}
.err{color:#ffb4a2;font-size:13px;margin:-10px 0 0;min-height:1em}

/* photo */
.shot{position:fixed;inset:0;z-index:12;background:rgba(8,10,14,.72);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.shot-card{display:flex;flex-direction:column;gap:12px;width:min(560px,100%)}
.shot-card img{width:100%;border-radius:16px;border:1px solid var(--line);display:block}
.shot-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.shot-actions p{margin:0 auto 0 0;font-size:12px;color:var(--ink-soft)}
.btn{border:1px solid var(--line);background:var(--glass-strong);border-radius:999px;padding:10px 18px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
@media (max-width:560px){.place{padding:9px 13px;font-size:13px}.tool{padding:8px}.actions{max-width:calc(100% - 170px)}.act{padding:11px 16px;font-size:14px}}
</style>

</head>
<body>
<canvas id="scene" aria-label="한강 풍경"></canvas>

<div class="hud hud-left" id="hudLeft" hidden>
  <div class="pill place">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 15c2.5 0 2.5-1.6 5-1.6S9.5 15 12 15s2.5-1.6 5-1.6 2.5 1.6 5 1.6"/><path d="M2 19c2.5 0 2.5-1.6 5-1.6S9.5 19 12 19s2.5-1.6 5-1.6 2.5 1.6 5 1.6"/><path d="M4 11V8l8-4 8 4v3"/></svg>
    <span>한강 <span class="dim">·</span> <span id="timeLabel">밤</span> <span class="dim" id="clock">00:00</span> <span class="dim">·</span> <span id="weatherLabel">맑음</span></span>
  </div>
</div>
<div class="hud hud-right" id="hudRight" hidden>
  <div class="pill tools">
    <div class="count" title="지금 같이 있는 사람">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.4 3-5 6-5s5.4 1.6 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 14.4c1.6.7 2.6 2.3 3 4.6"/></svg>
      <span><span id="count">1</span><span style="opacity:.55">/30</span></span>
    </div>
    <button class="tool" id="soundBtn" aria-label="소리 끄기"><svg viewBox="0 0 24 24" id="soundIcon"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    <button class="tool" id="setBtn" aria-label="설정" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    <button class="tool" id="chatBtn" aria-label="말하기" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6.5h16v9.5H10l-4 3.5v-3.5H4z"/><path d="M8 10.5h8M8 13h5"/></svg></button>
    <button class="tool" id="camBtn" aria-label="사진 찍기"><svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10H4z"/><circle cx="12" cy="13" r="3.4"/></svg></button>
  </div>
  <div class="panel" id="settings" hidden>
    <h3>날씨<span class="badge" id="adminBadge" hidden>관리자</span></h3>
    <div class="seg" id="weatherSeg" hidden>
      <button data-w="clear">맑음</button><button data-w="cloudy">흐림</button><button data-w="rain">비</button><button data-w="snow">눈</button><button data-w="fog">안개</button>
    </div>
    <p id="weatherNote">날씨는 관리자가 정합니다. 시간대는 한국 시간에 맞춰 자동으로 바뀝니다.</p>
    <h3>소리</h3>
    <label class="slider" for="volWater">물소리<input type="range" id="volWater" min="0" max="100" value="70"></label>
    <label class="slider" for="volNature">자연<input type="range" id="volNature" min="0" max="100" value="55"></label>
    <label class="slider" for="volAnimal">동물<input type="range" id="volAnimal" min="0" max="100" value="45"></label>
    <label class="slider" for="volStep">발소리<input type="range" id="volStep" min="0" max="100" value="60"></label>
  </div>
  <div class="panel" id="chatPanel" hidden>
    <h3>말하기</h3>
    <div class="chat-grid" id="chatGrid"></div>
  </div>
</div>

<div class="joy" id="joy" hidden aria-label="이동 패드"><div class="joy-knob" id="knob"></div></div>
<div class="pill keys" id="keys" hidden><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span><span><kbd>Shift</kbd> 달리기</span><span><kbd>1</kbd>~<kbd>6</kbd> 말하기</span><span>드래그로 둘러보기</span></div>
<div class="actions" id="actions" hidden>
  <div class="pill status" id="status" hidden></div>
  <div class="act-row" id="actRow"></div>
</div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<div class="gate" id="gate1">
  <div class="gate-hero">
    <h1>한강 돗자리</h1>
    <p>말없이 같이 앉아 강을 보는 곳</p>
    <button class="enter" id="enterBtn">입장</button>
    <p class="cap" id="capLine" hidden></p>
  </div>
</div>
<div class="gate" id="gate2" hidden>
  <form class="card" id="joinForm" novalidate>
    <h2>나는 누구로 갈까요</h2>
    <p class="sub">들어가서 마음에 드는 곳까지 걸어가 돗자리를 펴면 됩니다.</p>
    <label class="field" for="nameInput"><span>이름</span>
      <input id="nameInput" maxlength="10" autocomplete="nickname" placeholder="강가에서 불릴 이름">
    </label>
    <div class="field"><span>캐릭터</span>
      <div class="choices" id="genderChoices">
        <button type="button" class="choice" data-g="m" aria-pressed="true">
          <svg viewBox="0 0 48 48"><circle cx="24" cy="20" r="12" fill="#f2c9a0"/><path d="M12 19c0-8 5-12 12-12s12 4 12 12c-3-4-7-5-12-5s-9 1-12 5z" fill="#2b2420"/><rect x="15" y="31" width="18" height="13" rx="7" fill="#7fa7c9"/></svg>남자</button>
        <button type="button" class="choice" data-g="f" aria-pressed="false">
          <svg viewBox="0 0 48 48"><path d="M11 20c0-9 6-13 13-13s13 4 13 13v14H11z" fill="#4a3226"/><circle cx="24" cy="21" r="11" fill="#f2c9a0"/><path d="M13 19c1-7 6-10 11-10s10 3 11 10c-4-3-8-4-11-6-3 2-7 3-11 6z" fill="#4a3226"/><rect x="15" y="31" width="18" height="13" rx="7" fill="#e9a46b"/></svg>여자</button>
      </div>
    </div>
    <p class="err" id="err"></p>
    <button class="go" type="submit">한강으로 가기</button>
  </form>
</div>

<div class="shot" id="shot" hidden>
  <div class="shot-card">
    <img id="shotImg" alt="방금 찍은 한강 사진">
    <div class="shot-actions">
      <p id="shotTip"></p>
      <button class="btn" id="shotClose">닫기</button>
      <button class="btn primary" id="shotSave" hidden>저장</button>
    </div>
  </div>
</div>

<script>
/* ===================== 여기만 바꾸세요 =====================
   Supabase 대시보드 > Project Settings > API 에서 복사해 붙여넣습니다.
   anon public 키는 원래 공개용이라 이 파일에 넣어도 괜찮습니다.
   (service_role 키는 절대 넣지 마세요) */
window.HANGANG_CONFIG = {
  supabaseUrl: "https://plzsnyvrubuetsnxurfr.supabase.co",
  supabaseAnonKey: "sb_publishable_WFtymiPrXSqZnU-w7qXLpQ__jtYIrU7",
  roomName: "hangang-dotjari"
};
/* ============================================================ */
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   한강 돗자리 · 공개 배포용 연결 코드
   claude.ai 안에서 쓰던 기능(접속자 동기화, 날씨, 사진 저장)을
   Supabase Realtime으로 바꿔 줍니다.
   ============================================================ */
(() => {
  const CFG = window.HANGANG_CONFIG || {};
  const ADMIN_KEY = "hangang-admin-code";
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // 사진 저장은 설정이 없어도 동작
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return { saved: true };
    }
  };

  const ready = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase && window.supabase.createClient);
  if (!ready) {
    console.warn("[한강 돗자리] Supabase 설정이 없어 혼자 보기 모드로 실행합니다.");
    window.claude = { use: async name => (name === "downloads" ? downloads : null) };
    return;
  }

  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { realtime: { params: { eventsPerSecond: 20 } } });
  const myId = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const channel = sb.channel(CFG.roomName || "hangang-dotjari", { config: { presence: { key: myId }, broadcast: { self: false } } });

  /* ---------- room: 접속자 상태 ---------- */
  const states = new Map();       // 다른 사람 id -> 상태
  let members = new Set();        // 지금 접속 중인 id
  let mine = {};
  const peerListeners = [];
  let emitQueued = false, subscribed = false;
  function emitPeers() {
    emitQueued = false;
    const peers = [{ peer: myId, by: null, isMe: true, sameTab: true, kind: "viewer", guest: false, presence: mine, updatedAt: Date.now() }];
    members.forEach(id => { if (id !== myId && states.has(id)) peers.push({ peer: id, by: null, isMe: false, sameTab: false, kind: "viewer", guest: false, presence: states.get(id), updatedAt: Date.now() }); });
    peerListeners.forEach(f => { try { f({ peers, joined: [], left: [], updated: [] }); } catch (e) { console.error(e); } });
  }
  const schedule = () => { if (!emitQueued) { emitQueued = true; requestAnimationFrame(emitPeers); } };

  let lastSend = 0, sendTimer = null;
  function sendState() {
    if (!subscribed || !Object.keys(mine).length) return;
    lastSend = performance.now();
    channel.send({ type: "broadcast", event: "s", payload: { id: myId, s: mine } });
  }
  function queueSend(force) {
    const wait = 200 - (performance.now() - lastSend);
    if (force || wait <= 0) { clearTimeout(sendTimer); sendTimer = null; sendState(); }
    else if (!sendTimer) sendTimer = setTimeout(() => { sendTimer = null; sendState(); }, wait);
  }

  channel.on("presence", { event: "sync" }, () => {
    members = new Set(Object.keys(channel.presenceState()));
    for (const id of [...states.keys()]) if (!members.has(id)) states.delete(id);
    schedule();
  });
  channel.on("presence", { event: "join" }, ({ key }) => { if (key !== myId) queueSend(true); });
  channel.on("broadcast", { event: "s" }, ({ payload }) => {
    if (!payload || typeof payload.id !== "string" || payload.id === myId || !payload.s || typeof payload.s !== "object") return;
    states.set(payload.id, payload.s); members.add(payload.id); schedule();
  });

  const weatherListeners = [];
  channel.on("broadcast", { event: "weather" }, ({ payload }) => {
    if (payload && typeof payload.w === "string") weatherListeners.forEach(f => f(payload.w));
  });

  channel.subscribe(async status => {
    if (status === "SUBSCRIBED") { subscribed = true; await channel.track({ at: Date.now() }); queueSend(true); schedule(); }
  });
  addEventListener("pagehide", () => { try { channel.untrack(); sb.removeChannel(channel); } catch (e) {} });

  const room = {
    async presence(patch) {
      // 앉기·눕기 같은 상태 변화와 말풍선은 바로 보내고, 걷는 위치는 0.2초마다 묶어서 보냄
      const urgent = ("st" in patch && patch.st !== mine.st) || (patch.say && (!mine.say || patch.say.at !== mine.say.at)) || ("bt" in patch && JSON.stringify(patch.bt ?? null) !== JSON.stringify(mine.bt ?? null));
      for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
      queueSend(urgent);
      schedule();
    },
    onPeers(handler) { peerListeners.push(handler); setTimeout(emitPeers, 0); return () => { const i = peerListeners.indexOf(handler); if (i >= 0) peerListeners.splice(i, 1); }; },
    peers() { return []; },
    connected() { return subscribed; }
  };

  /* ---------- db: 날씨 하나만 다룸 ---------- */
  const db = {
    doc(path) {
      if (path !== "live/weather") throw new Error("unsupported path");
      return {
        onSnapshot(next) {
          const deliver = w => next({ exists: true, data: () => ({ w }) });
          const load = async () => {
            const { data, error } = await sb.from("world").select("weather").eq("id", 1).maybeSingle();
            if (!error && data && data.weather) deliver(data.weather);
          };
          load(); const t = setInterval(load, 60000);
          weatherListeners.push(deliver);
          return () => clearInterval(t);
        },
        async set({ w }) {
          const code = store.get(ADMIN_KEY) || "";
          const { data, error } = await sb.rpc("set_weather", { p_code: code, p_weather: w });
          if (error || data !== true) throw new Error("not_permitted");
          channel.send({ type: "broadcast", event: "weather", payload: { w } });
        }
      };
    }
  };

  /* ---------- user: 관리자 여부 ---------- */
  const user = { async canEdit() { return !!store.get(ADMIN_KEY); }, async isOwner() { return !!store.get(ADMIN_KEY); } };

  window.claude = {
    use: async name => name === "room" ? room : name === "db" ? db : name === "user" ? user : name === "downloads" ? downloads : null
  };

  /* ---------- 관리자 로그인: 주소 뒤에 #admin ---------- */
  function adminBox() {
    if (document.getElementById("adminBox")) return;
    const wrap = document.createElement("div");
    wrap.id = "adminBox";
    wrap.style.cssText = "position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,10,14,.7);padding:16px";
    const loggedIn = !!store.get(ADMIN_KEY);
    wrap.innerHTML = `
      <form style="background:#1b2330;border:1px solid rgba(244,239,230,.16);border-radius:20px;padding:22px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;color:#f4efe6;font-family:inherit">
        <b style="font-size:18px">관리자</b>
        <span style="font-size:13px;opacity:.7">${loggedIn ? "이 기기는 관리자로 로그인되어 있습니다." : "비밀번호를 넣으면 이 기기에서 날씨를 바꿀 수 있습니다."}</span>
        ${loggedIn ? "" : '<input type="password" id="adminCode" autocomplete="current-password" placeholder="관리자 비밀번호" style="background:rgba(255,255,255,.07);border:1px solid rgba(244,239,230,.16);border-radius:12px;padding:12px;color:#f4efe6;font:inherit;font-size:16px">'}
        <span id="adminMsg" style="font-size:13px;color:#ffb4a2;min-height:1em"></span>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button type="button" id="adminClose" style="border:1px solid rgba(244,239,230,.16);background:none;color:inherit;border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer">닫기</button>
          <button type="submit" style="border:0;background:#f1b26b;color:#2a1a0b;border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer">${loggedIn ? "로그아웃" : "로그인"}</button>
        </div>
      </form>`;
    document.body.appendChild(wrap);
    const close = () => { wrap.remove(); history.replaceState(null, "", location.pathname + location.search); };
    wrap.querySelector("#adminClose").onclick = close;
    wrap.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      if (loggedIn) { store.del(ADMIN_KEY); location.replace(location.pathname + location.search); return; }
      const code = wrap.querySelector("#adminCode").value;
      const { data, error } = await sb.rpc("check_admin", { p_code: code });
      if (error) { wrap.querySelector("#adminMsg").textContent = "서버에 연결하지 못했습니다. 설정을 확인해 주세요."; return; }
      if (data !== true) { wrap.querySelector("#adminMsg").textContent = "비밀번호가 맞지 않습니다."; return; }
      store.set(ADMIN_KEY, code); location.replace(location.pathname + location.search);
    };
  }
  const checkHash = () => { if (location.hash === "#admin") (document.readyState === "loading" ? addEventListener("DOMContentLoaded", adminBox) : adminBox()); };
  checkHash(); addEventListener("hashchange", checkHash);
})();

</script>

const waterU = { t:{value:0}, deep:{value:new THREE.Color()}, shallow:{value:new THREE.Color()}, skyC:{value:new THREE.Color()}, sunCol:{value:new THREE.Color()}, sunDir:{value:new THREE.Vector3()}, fogCol:{value:new THREE.Color()}, camPos:{value:new THREE.Vector3()}, fogNear:{value:80}, fogFar:{value:760}, rough:{value:0.9} };

let envStreak = 0;
function applyEnv() {
  const k = kst(); hourNow = k.getHours() + k.getMinutes() / 60; phase = phaseLabel(hourNow);

  const overcast = w === "cloudy" ? 0.6 : w === "rain" ? 0.8 : w === "snow" ? 0.65 : w === "fog" ? 0.5 : 0;
  const grey = new THREE.Color(0x8e959d).multiplyScalar(0.25 + 0.75 * Math.min(1, T.hemiI));
  const mix = (hex, amt) => new THREE.Color(hex).lerp(grey, amt);
  skyU.top.value.copy(mix(T.top, overcast)); skyU.mid.value.copy(mix(T.mid, overcast)); skyU.hor.value.copy(mix(T.hor, overcast * 0.9));
  skyU.sunCol.value.set(T.sun).multiplyScalar(1 - overcast * 0.85); skyU.sunDir.value.set(...T.sunDir).normalize();
  skyU.stars.value = T.stars * (1 - overcast); skyU.disk.value = T.disk * (1 - overcast);
  sun.color.set(T.sun); sun.intensity = T.sunI * (1 - overcast * 0.6); sun.position.copy(skyU.sunDir.value).multiplyScalar(200);
  hemi.color.set(T.hemiS).lerp(grey, overcast * 0.5); hemi.groundColor.set(T.hemiG); hemi.intensity = T.hemiI * (1 - overcast * 0.15);
  const fogC = mix(T.fog, overcast * 0.8); scene.fog.color.copy(fogC);
  const near = w === "fog" ? 6 : w === "rain" || w === "snow" ? 30 : 80, farD = w === "fog" ? 150 : w === "rain" ? 380 : w === "snow" ? 420 : 760;
  scene.fog.near = near; scene.fog.far = farD; waterU.fogNear.value = near; waterU.fogFar.value = farD;
  waterU.deep.value.copy(mix(T.deep, overcast * 0.4)); waterU.shallow.value.copy(mix(T.shallow, overcast * 0.4));
  waterU.skyC.value.copy(skyU.mid.value).lerp(skyU.hor.value, 0.5);
  waterU.sunCol.value.copy(skyU.sunCol.value).multiplyScalar(phase === "밤" ? 0.5 : 1); waterU.sunDir.value.copy(skyU.sunDir.value); waterU.fogCol.value.copy(fogC);
  waterU.rough.value = w === "rain" ? 1.6 : 0.9;

  lampHeadM.color.set(T.lamps > 0.3 ? 0xffd7a0 : 0xbfb9ad);
  const lampsOn = Math.max(T.lamps, overcast > 0.5 ? 0.4 : 0);
  lampLights.forEach(l => l.intensity = lampsOn * 1.4); playerLight.intensity = lampsOn * 0.9;
  bridgeLights.forEach(b => b.m.color.copy(b.base).multiplyScalar(0.35 + T.glow * 0.65));

  if (audio.ready) audio.onEnv();
}

    return;
  }
  const inp = inputVec(); lastInput = inp;
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  let dx = fx * inp.f + rx * inp.r, dz = fz * inp.f + rz * inp.r; const mag = Math.hypot(dx, dz);
  me.moving = mag > 0.05;
  if (boarded) {
    if (boarded.driver) {
      boatLocal.r -= inp.r * dt * 1.4;
      const sp = inp.f * 3.2 * dt; boatLocal.x += -Math.sin(boatLocal.r) * sp; boatLocal.z += -Math.cos(boatLocal.r) * sp;
      const bx = clamp(boatLocal.x, BOUND.x0 + 1, BOUND.x1 - 1), bz = clamp(boatLocal.z, BOUND.waterZ0 + 1, -3.4);
      if (bx !== boatLocal.x || bz !== boatLocal.z) { if (Math.abs(inp.f) > 0.2) hitBound(); boatLocal.x = bx; boatLocal.z = bz; }
    }
    return;
  }
  if (me.st === "sit" || me.st === "lie" || me.st === "bench") { me.moving = false; return; }
  if (!me.moving) { me.speed = 0; return; }
  dx /= Math.max(mag, 1); dz /= Math.max(mag, 1);
  const base = me.st === "swim" ? (me.tube ? 1.4 : 1.8) : inp.run ? 7 : 3.6;
  me.speed = base * Math.min(1, mag);
  let nx = me.x + dx * base * dt, nz = me.z + dz * base * dt;
  me.moveYaw = yawFrom(dx, dz);
  me.r = lerpAngle(me.r, me.moveYaw + (me.st === "swim" && !me.tube ? Math.PI : 0), Math.min(1, dt * 10));
  if (me.st === "walk" && me.level === "stairs") {
    nz = clamp(nz, STAIR.z0 + 0.15, STAIR.z1 - 0.15);
    if (nx > STAIR.bot) me.level = "ground";
    else if (nx < STAIR.top) { if (inDeck(nx, nz)) me.level = "bridge"; else nx = STAIR.top; }
    me.y = me.level === "bridge" ? BR.y : me.level === "stairs" ? stairY(nx) : 0;
  } else if (me.st === "walk" && me.level === "bridge") {
    const gap = nz > STAIR.z0 + 0.15 && nz < STAIR.z1 - 0.15;
    if (nx > BR.x + BR.half && gap) { me.level = "stairs"; me.y = stairY(nx); }
    else {
      const cx = clamp(nx, BR.x - BR.half, BR.x + BR.half), cz = clamp(nz, BR.z0, BR.z1);
      if (cz !== nz) hitBound();
      nx = cx; nz = cz; me.y = BR.y;
    }
  } else if (me.st === "walk" && inStairs(nx, nz)) {
    if (me.x >= STAIR.bot - 0.6) { me.level = "stairs"; me.y = stairY(nx); }
    else { nx = me.x; nz = me.z; }
  } else if (me.st === "walk") {
    if (nx < BOUND.x0 || nx > BOUND.x1 || nz > BOUND.landZ1) { hitBound(); nx = clamp(nx, BOUND.x0, BOUND.x1); nz = Math.min(nz, BOUND.landZ1); }
    if (nz < BOUND.landZ0 && !onDock(nx, nz)) {
      const dockSide = Math.abs(nx - DOCK.x) < 8.5;
      const tz = dockSide ? -4 : -2.2, tx = dockSide && Math.abs(nx - DOCK.x) < 8.5 ? nx : nx;
      anim = { t: 0, dur: 0.6, from: [me.x, me.z, me.y || 0], to: [tx, tz, -0.85], hop: 0.9, then: () => {
        me.st = "swim"; me.y = 0; rebuildMe(); doSplash(me.x, me.z); toast("풍덩! 한강에 빠졌습니다. 강가로 헤엄쳐 나오세요"); publish(true); actKey = ""; refreshActions();
      } };
      return;
    }
  } else if (me.st === "swim") {
    if (nx < BOUND.x0 || nx > BOUND.x1 || nz < BOUND.waterZ0) { hitBound(); nx = clamp(nx, BOUND.x0, BOUND.x1); nz = Math.max(nz, BOUND.waterZ0); }
    const underDock = Math.abs(nx - DOCK.x) < 9.5;
    const shore = underDock ? -2.8 : -0.9;
    if (nz > shore) {
      if (dz > 0.3 && !underDock) {
        anim = { t: 0, dur: 0.7, from: [me.x, me.z, -0.85], to: [nx, 2.6, 0], hop: 0.9, then: () => {
          me.st = "walk"; me.level = "ground"; me.tube = false; me.y = 0; rebuildMe(); toast("뭍으로 올라왔습니다"); publish(true); actKey = ""; refreshActions();
        } };
        me.st = "walk"; me.tube = false; rebuildMe(); return;
      }
      nz = shore;
    }
  }
  me.x = nx; me.z = nz;
}

/* ================= main loop ================= */
applyEnv(); setInterval(applyEnv, 30000);
const clock = new THREE.Clock(); let T = 0, actTimer = 0;
const tmpV = new THREE.Vector3(), UP = UPV;
let stepPh = 0, stepSide = false;
function seatOf(boatIdx, peer) {
  const b = boats[boatIdx], s = b.pair && b.pair[1] === peer ? 1 : -1;
  tmpV.set(s * 0.45, 0, 0.25).applyAxisAngle(UP, b.r);
  return { x: b.x + tmpV.x, z: b.z + tmpV.z, y: b.obj.position.y + 0.2, r: b.r };
}
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05); T += dt;
  waterU.t.value = T; skyU.t.value = T;
  streaks.forEach(s => { s.m.opacity = envStreak * (0.55 + 0.25 * Math.sin(T * 1.7 + s.ph) + 0.15 * Math.sin(T * 4.3 + s.ph * 2)); });

  if (started) stepPlayer(dt);

  // boats
  const pairs = boatPairs();
  boats.forEach((b, i) => {
    const pair = pairs[i]; b.pair = pair;
    if (boarded && boarded.id === i && boarded.driver) { b.tx = boatLocal.x; b.tz = boatLocal.z; b.tr = boatLocal.r; }
    else if (pair) { const drv = others.get(pair[0]); if (drv && typeof drv.p.bx === "number") { b.tx = drv.p.bx; b.tz = drv.p.bz; b.tr = drv.p.br; } }
    else { b.tx = b.home[0]; b.tz = b.home[1]; b.tr = 0; }
    const k = Math.min(1, dt * (pair ? 8 : 1.2));
    b.x += (b.tx - b.x) * k; b.z += (b.tz - b.z) * k; b.r = lerpAngle(b.r, b.tr, k);
    b.obj.position.set(b.x, -0.6 + Math.sin(T * 1.6 + i) * 0.05, b.z);
    b.obj.rotation.set(Math.sin(T * 1.3 + i) * 0.03, b.r, Math.sin(T * 1.1 + i * 2) * 0.03);
    if (pair) b.obj.userData.wheel.rotation.x += dt * 4;
  });

  // me
  if (myAvatar) {
    if (boarded) { const s = seatOf(boarded.id, myPeer); me.x = s.x; me.z = s.z; me.r = s.r; myAvatar.position.set(s.x, s.y, s.z); myAvatar.rotation.y = s.r; }
    else {
      const baseY = me.st === "swim" ? (me.tube ? -0.95 : -0.85) + Math.sin(T * 2) * 0.04 : me.y;
      myAvatar.position.set(me.x, anim ? me.y : baseY, me.z);
      myAvatar.rotation.y = me.st === "sit" || me.st === "lie" || me.st === "bench" ? 0 : me.r;
    }
    animateAvatar(myAvatar, T, me.moving, me.speed);
    const showGhost = me.st === "walk" && !anim && !me.moving && !me.bt && canSpread();
    ghost.visible = showGhost;
    if (showGhost) { ghost.position.set(me.x, me.y + 0.05, me.z + 0.1); ghost.material.color.set(matConflict(me.x, me.z) ? 0xff8a7a : 0x9be3a0); }
    playerLight.position.set(me.x + 1.5, me.y + 4, me.z + 3);
    // footsteps and strokes
    if (!anim && me.moving && (me.st === "walk" || me.st === "swim")) {
      const rate = me.st === "swim" ? 3 : me.speed > 5 ? 11 : 7;
      stepPh += dt * rate;
      if (stepPh > Math.PI) {
        stepPh -= Math.PI; stepSide = !stepSide;
        if (audio.ready) {
          if (me.st === "swim") { if (stepSide) audio.paddle(); }
          else audio.step(me.level !== "ground" ? "deck" : onDock(me.x, me.z) ? "wood" : onPath(me.z) ? "path" : "grass", stepSide);
        }
      }
    } else stepPh = Math.PI * 0.75;
  }

  // others
  for (const [peer, o] of others) {
    const p = o.p; let tx = p.x, tz = p.z, tr = p.r, ty = 0, onBoat = false;
    if (p.st === "boat" && p.bt) { const b = boats[p.bt.id]; if (b.pair && b.pair.includes(peer)) { const s = seatOf(p.bt.id, peer); tx = s.x; tz = s.z; tr = s.r; ty = s.y; onBoat = true; } }
    if (p.st === "sit" || p.st === "lie" || p.st === "bench") tr = 0;
    if (!onBoat) ty = p.y;
    if (p.st === "swim") ty = (p.tb ? -0.95 : -0.85) + Math.sin(T * 2 + p.x) * 0.04;
    const k = onBoat ? 1 : Math.min(1, dt * 10);
    const moving = Math.hypot(tx - o.x, tz - o.z) > 0.03;
    o.x += (tx - o.x) * k; o.z += (tz - o.z) * k; o.r = lerpAngle(o.r, tr, k);
    o.obj.position.set(o.x, ty, o.z); o.obj.rotation.y = o.r;
    animateAvatar(o.obj, T, moving, 3.6);
  }

  // NPCs
  const camP = camera.position;
  npcs.forEach(n => {
    n.x += n.dir * n.speed * dt; if (n.x > 150) n.dir = -1; if (n.x < -90) n.dir = 1;
    if (T > n.offUntil) n.toff = 0; n.off += (n.toff - n.off) * Math.min(1, dt * 3);
    const z = n.lane + n.off;
    n.obj.position.set(n.x, 0, z); n.obj.rotation.y = n.dir > 0 ? -Math.PI / 2 : Math.PI / 2;
    if (n.kind === "bike") {
      n.bike.userData.wheels.forEach(w => w.rotation.x -= dt * n.speed / 0.32);
      const pd = T * n.speed * 1.4; n.rider.userData.legs[0].rotation.x = Math.PI / 2 - 0.5 + Math.sin(pd) * 0.45; n.rider.userData.legs[1].rotation.x = Math.PI / 2 - 0.5 - Math.sin(pd) * 0.45;
      // bell: when someone is ahead in the bike lane, or now and then
      const ahead = (ox, oz) => { const dx = (ox - n.x) * n.dir; return dx > 0 && dx < 11 && Math.abs(oz - z) < 1.6; };
      let ring = T > n.nextBell;
      if (!ring && T - n.bellAt > 6) ring = (started && me.level === "ground" && ahead(me.x, me.z)) || [...others.values()].some(o => ahead(o.x, o.z));
      if (ring) { n.bellAt = T; n.nextBell = T + 10 + Math.random() * 18; if (audio.ready) { const d = Math.hypot(n.x - camP.x, z - camP.z); audio.bell(Math.pow(clamp(1 - d / 45, 0, 1), 2)); } }
    } else animateAvatar(n.obj, T, true, n.kind === "run" ? 6 : 3);
    if (n.dog) {
      dog.position.set(n.x + n.dir * 1.7, 0, z - 0.7); dog.rotation.y = n.obj.rotation.y;
      const ds = Math.sin(T * 10) * 0.5; dog.userData.legs.forEach((l, i) => l.rotation.x = (i % 3 === 0 ? ds : -ds)); dog.userData.tail.rotation.z = Math.sin(T * 14) * 0.6;
    }
  });
  // runners: "지나갈게요~~" when about to bump into someone
  npcs.forEach(r => {
    if (r.kind !== "run" || T - r.sayAt < 7) return;
    const rz = r.lane + r.off, list = [];
    npcs.forEach(o => { if (o !== r && o.kind !== "bike") list.push([o.x, o.lane + o.off, o.dir * o.speed]); });
    if (started && me.level === "ground" && !anim) list.push([me.x, me.z, 0]);
    others.forEach(o => list.push([o.x, o.z, 0]));
    for (const [ox, oz, vx] of list) {
      const dx = (ox - r.x) * r.dir;
      if (dx > 0 && dx < 2.4 && Math.abs(oz - rz) < 0.9 && vx * r.dir < r.speed - 0.3) {
        r.sayAt = T; r.toff = oz > rz ? -0.95 : 0.95; r.offUntil = T + 1.8;
        showBubble(() => r.obj, "지나갈게요~!", 2.2, r);
        if (audio.ready) { const d = Math.hypot(r.x - camP.x, rz - camP.z); audio.speak("지나갈게요", 0.9 * clamp(1 - d / 28, 0, 1)); }
        break;
      }
    }
  });
  // bubbles follow their owners
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i], o = b.getObj();
    if (!o || T > b.until) { scene.remove(b.s); bubbles.splice(i, 1); continue; }
    b.s.position.set(o.position.x, o.position.y + (o.userData.h || 2) + 0.55, o.position.z);
    b.s.material.opacity = Math.min(1, (b.until - T) / 0.4, (T - (b.until - b.dur)) / 0.15);
  }

  // weather particles
  if (rain.visible) {
    const a = rainGeo.attributes.position.array;
    for (let i = 0; i < RAIN_N; i++) { const j = i * 6; a[j + 1] -= 32 * dt; a[j + 4] -= 32 * dt; if (a[j + 4] < -1) { const x = (Math.random() - .5) * 70, z = (Math.random() - .5) * 70, y = 26 + Math.random() * 6; a[j] = x; a[j + 1] = y; a[j + 2] = z; a[j + 3] = x; a[j + 4] = y - 0.7; a[j + 5] = z; } }
    rainGeo.attributes.position.needsUpdate = true; rain.position.set(camera.position.x, 0, camera.position.z);
  }
  if (snow.visible) {
    const a = snowGeo.attributes.position.array;
    for (let i = 0; i < SNOW_N; i++) { const j = i * 3; a[j + 1] -= 1.6 * dt; a[j] += Math.sin(T + i) * 0.4 * dt; if (a[j + 1] < -0.5) { a[j] = (Math.random() - .5) * 70; a[j + 1] = 28; a[j + 2] = (Math.random() - .5) * 70; } }
    snowGeo.attributes.position.needsUpdate = true; snow.position.set(camera.position.x, 0, camera.position.z);
  }
  if (splashT < 1.2) {
    splashT += dt; const a = splashGeo.attributes.position.array;
    for (let i = 0; i < splashN; i++) { const v = splashVel[i]; v[1] -= 14 * dt; a[i * 3] += v[0] * dt; a[i * 3 + 1] = Math.max(-0.6, a[i * 3 + 1] + v[1] * dt); a[i * 3 + 2] += v[2] * dt; }
    splashGeo.attributes.position.needsUpdate = true; splash.material.opacity = Math.max(0, 1 - splashT / 1.2);
  }

  // camera
  if (!started) {
    const x = -10 + Math.sin(T * 0.05) * 50;
    camera.position.set(x, 7 + Math.sin(T * 0.08) * 1.5, 34); camera.lookAt(x - 15, 6, -150);
  } else {
    const k = 1 - Math.exp(-dt * 6);
    if (me.st === "swim" && !anim) cam.tPitch = Math.max(cam.tPitch, 0.45); // stay above the embankment wall
    const idle = performance.now() - cam.dragAt > 900;
    if (boarded && idle) cam.tYaw = lerpAngle(cam.tYaw, boats[boarded.id].r, Math.min(1, dt * 1.5));
    cam.yaw = lerpAngle(cam.yaw, cam.tYaw, k); cam.pitch += (cam.tPitch - cam.pitch) * k; cam.dist += (cam.tDist - cam.dist) * k;
    const head = boarded ? 0.8 : me.st === "swim" ? -0.5 : me.st === "lie" ? 0.6 : me.st === "bench" ? 1.6 : 1.25;
    const fk = 1 - Math.exp(-dt * 10), fy = (boarded ? 0 : anim ? me.y : me.y) + head;
    cam.tx += (me.x - cam.tx) * fk; cam.ty += (fy - cam.ty) * fk; cam.tz += (me.z - cam.tz) * fk;
    const cp = Math.cos(cam.pitch);
    const px = cam.tx + Math.sin(cam.yaw) * cp * cam.dist, pz = cam.tz + Math.cos(cam.yaw) * cp * cam.dist;
    let py = cam.ty + Math.sin(cam.pitch) * cam.dist;
    const floor = (me.level === "bridge" && inDeck(px, pz) ? BR.y : pz > BOUND.landZ0 ? 0 : -0.6) + 0.4;
    if (py < floor) py = floor;
    camPos.set(px, py, pz);
    if (!cam.init) { camera.position.copy(camPos); cam.init = true; } else camera.position.lerp(camPos, 1 - Math.exp(-dt * 14));
    camera.lookAt(cam.tx - Math.sin(cam.yaw) * 2.5, cam.ty + 0.35, cam.tz - Math.cos(cam.yaw) * 2.5);
    publish(false);
    actTimer += dt; if (actTimer > 0.2) { actTimer = 0; refreshActions(); }
  }
  waterU.camPos.value.copy(camera.position); sky.position.copy(camera.position);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
