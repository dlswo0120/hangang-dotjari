<script>
/* ============================================================
   한강 돗자리 · 공개 배포용 연결 코드
   claude.ai 안에서 쓰던 기능(접속자 동기화, 날씨, 사진 저장)을
   Supabase Realtime으로 바꿔 줍니다.
   ============================================================ */
(() => {
  const CFG = window.HANGANG_CONFIG || {};
  const ADMIN_KEY = "hangang-admin-code";
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // 사진 저장은 설정이 없어도 동작
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      // 휴대폰: 공유 창을 열어 '이미지 저장'으로 사진 앱에 바로 저장
      if (matchMedia("(pointer: coarse)").matches && navigator.canShare && typeof File === "function") {
        const file = new File([blob], filename, { type: blob.type || "image/png" });
        if (navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file] }); return { saved: true }; }
          catch (e) { if (e && e.name === "AbortError") { const c = new Error("cancelled"); c.code = "cancelled"; throw c; } }
        }
      }
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return { saved: true };
    }
  };

  const ready = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase && window.supabase.createClient);
  if (!ready) {
    console.warn("[한강 돗자리] Supabase 설정이 없어 혼자 보기 모드로 실행합니다.");
    window.claude = { use: async name => (name === "downloads" ? downloads : null) };
    return;
  }

  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { realtime: { params: { eventsPerSecond: 20 } } });
  const myId = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  /* ---------- 보안: 보낸 사람 확인(서명) · 너무 많이 보내는 사람 막기 ---------- */
  // 들어올 때 이 화면만의 열쇠를 만들고, 공개 열쇠는 접속 정보에 같이 실어 보냄.
  // 내 메시지는 모두 서명해서 보내고, 받은 메시지는 그 id의 공개 열쇠로 확인 → 다른 사람 id로 꾸민 메시지는 버림
  const ECDSA = { name: "ECDSA", namedCurve: "P-256" }, SIGN = { name: "ECDSA", hash: "SHA-256" };
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
  const te = new TextEncoder();
  // server may re-encode JSON and reorder keys, so both ends sign the same canonical text
  const canon = v => Array.isArray(v) ? "[" + v.map(canon).join(",") + "]"
    : v && typeof v === "object" ? "{" + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}"
    : JSON.stringify(v === undefined ? null : v);
  const SEC = { priv: null, pub: "", seq: 0 };
  const keyReady = (async () => {
    try { const kp = await crypto.subtle.generateKey(ECDSA, false, ["sign", "verify"]); SEC.priv = kp.privateKey; SEC.pub = b64(await crypto.subtle.exportKey("raw", kp.publicKey)); }
    catch (e) { console.warn("[한강 돗자리] 서명 열쇠를 만들지 못했습니다", e); }
  })();
  const MAX_BYTES = 6000, FLOOD = 15, MUTE_MS = 60000;
  const bound = new Map();   // id -> Promise<CryptoKey|false>, or null = old page with no key (until they refresh)
  const verifyBudget = { t: 0, n: 0 }, lastQ = new Map(), chains = new Map(), muted = new Map(), rate = new Map(), pending = new Map();
  function bindKeys(ch) {
    // first key seen for an id stays for the whole visit: someone joining later with the same id can't swap it
    const st = ch.presenceState();
    for (const id in st) {
      if (bound.has(id) || id === myId) continue;
      const k = (st[id] || []).map(m => m && m.k).find(v => typeof v === "string" && v.length < 200);
      let kp = null;
      if (k) { try { kp = crypto.subtle.importKey("raw", unb64(k), ECDSA, false, ["verify"]).catch(() => false); } catch (e) { kp = Promise.resolve(false); } }
      bound.set(id, kp);
    }
  }
  function flooding(id) {
    const now = Date.now(), m = muted.get(id);
    if (m && now < m) return true;
    const r = rate.get(id) || { t: now, n: 0 };
    if (now - r.t > 1000) { r.t = now; r.n = 0; }
    r.n++; rate.set(id, r);
    if (r.n > FLOOD) { muted.set(id, now + MUTE_MS); console.warn("[한강 돗자리] 메시지를 너무 많이 보내는 접속을 1분 동안 무시합니다", id); return true; }
    return false;
  }
  // every incoming "s"/"p": right size, right sender, in order, signed → apply
  function receive(ch, ev, payload, body, apply) {
    const id = payload.id;
    if (muted.get(id) > Date.now()) return;
    let size = 0; try { size = JSON.stringify(payload).length; } catch (e) { return; }
    if (size > MAX_BYTES) return;
    if (!bound.has(id)) bindKeys(ch);
    if (!bound.has(id)) { // not in the room list yet: keep the latest full state until the list catches up
      if (ev === "s" && (pending.has(id) || pending.size < 40)) pending.set(id, () => receive(ch, ev, payload, body, apply));
      return;
    }
    const kp = bound.get(id);
    if (kp === null) { if (typeof payload.g !== "string" && !flooding(id)) apply(); return; } // old page: unsigned is all it can do
    const run = async () => {
      const key = await kp, q = payload.q;
      if (!key || typeof payload.g !== "string" || typeof q !== "number" || q <= (lastQ.get(id) || 0) || payload.g.length > 120) return;
      const now = Date.now(); if (now - verifyBudget.t > 1000) { verifyBudget.t = now; verifyBudget.n = 0; }
      if (++verifyBudget.n > 300) return; // a flood of forged messages can't eat the whole screen
      let ok = false;
      try { ok = await crypto.subtle.verify(SIGN, key, unb64(payload.g), te.encode(canon([id, ev, q, body]))); } catch (e) {}
      if (!ok || q <= (lastQ.get(id) || 0)) return;
      lastQ.set(id, q);
      if (!flooding(id)) apply(); // only messages really from them count, so nobody can get someone else muted
    };
    chains.set(id, (chains.get(id) || Promise.resolve()).then(run, run));
  }
  async function signed(ev, payload, body) {
    if (!SEC.priv) return payload;
    const q = ++SEC.seq;
    try { payload.q = q; payload.g = b64(await crypto.subtle.sign(SIGN, SEC.priv, te.encode(canon([myId, ev, q, body])))); } catch (e) {}
    return payload;
  }
  /* ---------- 방 나누기: 한 방 20명, 꽉 차면 다음 방 (무료 플랜 동시 접속 200명 = 방 10개) ---------- */
  const ROOM_CAP = CFG.roomCap || 20, ROOM_MAX = 10, BASE = CFG.roomName || "hangang-dotjari";
  const chanName = n => n === 1 ? BASE : BASE + "-" + n; // 1번 방은 예전 이름 그대로라 옛 버전 사용자와도 만남
  const PARKS = ["여의도", "반포", "뚝섬", "잠실", "망원", "이촌", "광나루", "난지", "잠원", "양화"]; // 방 이름 = 한강공원 이름
  const askedRoom = (() => { const n = parseInt(new URLSearchParams(location.search).get("room"), 10); return n >= 1 && n <= ROOM_MAX ? n : 0; })();
  let channel = null, roomNo = 0, movedFrom = 0, myName = "";

  /* ---------- 연결 상태 표시 ---------- */
  let netPill = null;
  function netNote(text) {
    if (!netPill) { netPill = document.createElement("div"); netPill.style.cssText = "position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:rgba(18,23,30,.82);color:#f4efe6;border:1px solid rgba(244,239,230,.16);border-radius:999px;padding:7px 14px;font-size:13px;pointer-events:none;transition:opacity .3s"; document.body.appendChild(netPill); }
    netPill.textContent = text || ""; netPill.style.opacity = text ? "1" : "0";
  }

  /* ---------- room: 접속자 상태 ---------- */
  const states = new Map();       // 다른 사람 id -> 상태
  let members = new Set();        // 지금 접속 중인 id
  let mine = {};
  const peerListeners = [];
  let emitQueued = false, subscribed = false;
  function emitPeers() {
    emitQueued = false;
    const peers = [{ peer: myId, by: null, isMe: true, sameTab: true, kind: "viewer", guest: false, presence: mine, updatedAt: Date.now() }];
    members.forEach(id => { if (id !== myId && states.has(id)) peers.push({ peer: id, by: null, isMe: false, sameTab: false, kind: "viewer", guest: false, presence: states.get(id), updatedAt: Date.now() }); });
    peerListeners.forEach(f => { try { f({ peers, joined: [], left: [], updated: [] }); } catch (e) { console.error(e); } });
  }
  const schedule = () => { if (!emitQueued) { emitQueued = true; requestAnimationFrame(emitPeers); } };

  /* ---------- 보내기: 위치만 바뀌면 작은 메시지, 나머지는 바뀔 때만 전체 ---------- */
  // 사람이 많을수록 위치를 덜 자주 보냄 (5명까지 0.2초 → 20명이면 0.6초). 받는 쪽은 사이를 부드럽게 이어 그림
  const POS_KEYS = ["x", "z", "y", "r", "bx", "bz", "br"];
  const sendGap = () => Math.min(600, 200 + Math.max(0, members.size - 5) * 27);
  let lastSend = 0, sendTimer = null, lastFull = "", needFull = true, sendChain = Promise.resolve();
  const sentAt = []; // my own cap: at most 6 messages a second, whatever the game asks for
  const legacy = new Set(); // people on the old page that only understands full messages (until they refresh)
  const restKey = () => { const o = {}; for (const k in mine) if (!POS_KEYS.includes(k)) o[k] = mine[k]; return JSON.stringify(o); };
  function sendState() {
    if (!subscribed || !channel || !Object.keys(mine).length) return;
    const now = performance.now();
    while (sentAt.length && now - sentAt[0] > 1000) sentAt.shift();
    if (sentAt.length >= 6) { if (!sendTimer) sendTimer = setTimeout(() => { sendTimer = null; sendState(); }, 1005 - (now - sentAt[0])); return; }
    sentAt.push(now); lastSend = now;
    const rest = restKey(), ch = channel;
    let ev, body, payload;
    if (needFull || rest !== lastFull || [...legacy].some(id => members.has(id))) { lastFull = rest; needFull = false; ev = "s"; body = JSON.parse(JSON.stringify(mine)); payload = { id: myId, s: body, v: 2 }; }
    else { ev = "p"; body = [mine.x, mine.z, mine.y, mine.r, mine.bx ?? null, mine.bz ?? null, mine.br ?? null]; payload = { id: myId, p: body }; }
    sendChain = sendChain.then(() => signed(ev, payload, body)).then(pl => { if (ch === channel) ch.send({ type: "broadcast", event: ev, payload: pl }); }).catch(() => {});
  }
  function queueSend(force) {
    const wait = sendGap() - (performance.now() - lastSend);
    if (force || wait <= 0) { clearTimeout(sendTimer); sendTimer = null; sendState(); }
    else if (!sendTimer) sendTimer = setTimeout(() => { sendTimer = null; sendState(); }, wait);
  }
  // 오래 조용하면 한 번씩 전체 상태를 보내서, 놓친 메시지가 있어도 다시 맞춰짐
  setInterval(() => { if (subscribed && performance.now() - lastSend > 15000) { needFull = true; sendState(); } }, 5000);

  function joinRoom(n) {
    return new Promise(resolve => {
      const ch = sb.channel(chanName(n), { config: { presence: { key: myId }, broadcast: { self: false } } });
      let decided = false, everJoined = false;
      const decide = full => {
        if (decided) return; decided = true;
        if (full) { try { sb.removeChannel(ch); } catch (e) {} resolve(false); return; }
        channel = ch; roomNo = n; everJoined = true;
        keyReady.then(() => ch.track({ at: Date.now(), n: myName, k: SEC.pub })).then(() => { subscribed = true; needFull = true; queueSend(true); schedule(); netNote(""); });
        resolve(true);
      };
      ch.on("presence", { event: "sync" }, () => {
        const ids = Object.keys(ch.presenceState());
        if (!decided) { decide(ids.filter(id => id !== myId).length >= ROOM_CAP); return; }
        if (ch !== channel) return;
        members = new Set(ids);
        for (const id of [...states.keys()]) if (!members.has(id)) states.delete(id);
        bindKeys(ch);
        for (const [id, f] of [...pending]) if (bound.has(id)) { pending.delete(id); f(); } else if (!members.has(id)) pending.delete(id);
        schedule();
      });
      ch.on("presence", { event: "join" }, ({ key }) => { if (ch === channel && key !== myId) { needFull = true; queueSend(true); } });
      ch.on("broadcast", { event: "s" }, ({ payload }) => {
        if (ch !== channel || !payload || typeof payload.id !== "string" || payload.id === myId || !payload.s || typeof payload.s !== "object" || Array.isArray(payload.s)) return;
        receive(ch, "s", payload, payload.s, () => {
          if (ch !== channel || !members.has(payload.id)) return;
          if (payload.v === 2) legacy.delete(payload.id); else legacy.add(payload.id);
          states.set(payload.id, payload.s); schedule();
        });
      });
      ch.on("broadcast", { event: "p" }, ({ payload }) => {
        if (ch !== channel || !payload || typeof payload.id !== "string" || payload.id === myId || !Array.isArray(payload.p) || payload.p.length !== 7) return;
        if (!states.has(payload.id)) return; // 전체 상태를 받기 전이면 무시 (곧 전체가 옴)
        receive(ch, "p", payload, payload.p, () => {
          const st = states.get(payload.id); if (!st || ch !== channel) return;
          const [x, z, y, r, bx, bz, br] = payload.p;
          const next = Object.assign({}, st, { x, z, y, r }); if (bx !== null) { next.bx = bx; next.bz = bz; next.br = br; } else { delete next.bx; delete next.bz; delete next.br; }
          states.set(payload.id, next); schedule();
        });
      });
      ch.on("broadcast", { event: "weather" }, ({ payload }) => {
        // anyone can send this message, so it only means "go look": the weather itself comes from the database
        if (payload && typeof payload.w === "string" && !flooding("weather")) weatherReloads.forEach(f => f());
      });
      ch.subscribe((status, err) => {
        if (status === "SUBSCRIBED") {
          if (!decided) setTimeout(() => decide(Object.keys(ch.presenceState()).filter(id => id !== myId).length >= ROOM_CAP), 1500); // 빈 방이면 sync가 늦게 옴
          else if (ch === channel) { ch.track({ at: Date.now(), n: myName, k: SEC.pub }).then(() => { subscribed = true; needFull = true; queueSend(true); netNote(""); }); }
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
          const msg = String((err && err.message) || "");
          if (!decided) { if (/too_many|connections/i.test(msg)) { decided = true; resolve("busy"); } return; }
          if (ch === channel && everJoined) { subscribed = false; netNote(/too_many/i.test(msg) ? "지금 한강에 사람이 아주 많아요. 잠시 후 다시 연결할게요…" : "📶 다시 연결하는 중…"); }
        }
      });
    });
  }
  const weatherReloads = [];
  // 입장 전: 모든 공원을 잠깐 들여다보고 인원과 이름만 세고 나옴 (내 자리는 차지하지 않음)
  function peek(n) {
    return new Promise(resolve => {
      const ch = sb.channel(chanName(n), { config: { presence: { key: "peek-" + myId + "-" + n } } });
      let done = false;
      const finish = () => { if (done) return; done = true; const st = ch.presenceState(), names = [];
        Object.values(st).forEach(m => { const nm = m && m[0] && m[0].n; if (typeof nm === "string" && nm) names.push(nm.slice(0, 10)); });
        try { sb.removeChannel(ch); } catch (e) {} resolve({ no: n, name: PARKS[n - 1], n: Object.keys(st).length, names }); };
      ch.on("presence", { event: "sync" }, () => setTimeout(finish, 150));
      ch.subscribe(status => { if (status === "SUBSCRIBED") setTimeout(finish, 1500); else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") finish(); });
      setTimeout(finish, 4000);
    });
  }
  let joining = null;
  async function join(n, name) {
    if (channel) return true;
    if (joining) return joining;
    myName = String(name || "").slice(0, 10);
    joining = (async () => {
      const ok = await joinRoom(n);
      joining = null;
      if (ok === "busy") { netNote("지금 한강에 사람이 아주 많아요. 조금 뒤에 다시 들어와 주세요 🙏"); return false; }
      return ok === true;
    })();
    return joining;
  }
  addEventListener("pagehide", () => { try { if (channel) { channel.untrack(); sb.removeChannel(channel); } } catch (e) {} });
  addEventListener("online", () => { if (channel && !subscribed) netNote("📶 다시 연결하는 중…"); });

  const room = {
    async presence(patch) {
      // 앉기·눕기 같은 상태 변화와 말풍선은 바로 보내고, 걷는 위치는 묶어서 보냄
      const urgent = ("st" in patch && patch.st !== mine.st) || (patch.say && (!mine.say || patch.say.at !== mine.say.at)) || ("bt" in patch && JSON.stringify(patch.bt ?? null) !== JSON.stringify(mine.bt ?? null));
      for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
      queueSend(urgent);
      schedule();
    },
    onPeers(handler) { peerListeners.push(handler); setTimeout(emitPeers, 0); return () => { const i = peerListeners.indexOf(handler); if (i >= 0) peerListeners.splice(i, 1); }; },
    peers() { return []; },
    connected() { return subscribed; },
    // 방 정보: 몇 번 방인지, 정원, 다른 방 주소
    info() { return { no: roomNo, name: PARKS[roomNo - 1] || "", parks: PARKS, cap: ROOM_CAP, max: ROOM_MAX, asked: askedRoom, movedFrom, link: n => location.origin + location.pathname + "?room=" + n }; },
    lobby() { return Promise.all(PARKS.map((_, i) => peek(i + 1))); },
    join,
    async leave() { subscribed = false; try { await channel.untrack(); } catch (e) {} try { sb.removeChannel(channel); } catch (e) {} }
  };

  /* ---------- db: 날씨 하나만 다룸 ---------- */
  const db = {
    doc(path) {
      if (path !== "live/weather") throw new Error("unsupported path");
      return {
        onSnapshot(next) {
          const deliver = w => next({ exists: true, data: () => ({ w }) });
          const load = async () => {
            const { data, error } = await sb.from("world").select("weather").eq("id", 1).maybeSingle();
            if (!error && data && data.weather) deliver(data.weather);
          };
          load(); const t = setInterval(load, 60000);
          weatherReloads.push(load);
          return () => clearInterval(t);
        },
        async set({ w }) {
          const code = store.get(ADMIN_KEY) || "";
          const { data, error } = await sb.rpc("set_weather", { p_code: code, p_weather: w });
          if (error || data !== true) throw new Error("not_permitted");
          if (channel) channel.send({ type: "broadcast", event: "weather", payload: { w } });
        }
      };
    }
  };

  /* ---------- user: 관리자 여부 ---------- */
  const user = { async canEdit() { return !!store.get(ADMIN_KEY); }, async isOwner() { return !!store.get(ADMIN_KEY); } };

  window.claude = {
    use: async name => name === "room" ? room : name === "db" ? db : name === "user" ? user : name === "downloads" ? downloads : null
  };

  /* ---------- 관리자 로그인: 주소 뒤에 #admin ---------- */
  function adminBox() {
    if (document.getElementById("adminBox")) return;
    const wrap = document.createElement("div");
    wrap.id = "adminBox";
    wrap.style.cssText = "position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,10,14,.7);padding:16px";
    const loggedIn = !!store.get(ADMIN_KEY);
    wrap.innerHTML = `
      <form style="background:#1b2330;border:1px solid rgba(244,239,230,.16);border-radius:20px;padding:22px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;color:#f4efe6;font-family:inherit">
        <b style="font-size:18px">관리자</b>
        <span style="font-size:13px;opacity:.7">${loggedIn ? "이 기기는 관리자로 로그인되어 있습니다." : "비밀번호를 넣으면 이 기기에서 날씨를 바꿀 수 있습니다."}</span>
        ${loggedIn ? "" : '<input type="password" id="adminCode" autocomplete="current-password" placeholder="관리자 비밀번호" style="background:rgba(255,255,255,.07);border:1px solid rgba(244,239,230,.16);border-radius:12px;padding:12px;color:#f4efe6;font:inherit;font-size:16px">'}
        <span id="adminMsg" style="font-size:13px;color:#ffb4a2;min-height:1em"></span>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button type="button" id="adminClose" style="border:1px solid rgba(244,239,230,.16);background:none;color:inherit;border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer">닫기</button>
          <button type="submit" style="border:0;background:#f1b26b;color:#2a1a0b;border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer">${loggedIn ? "로그아웃" : "로그인"}</button>
        </div>
      </form>`;
    document.body.appendChild(wrap);
    const close = () => { wrap.remove(); history.replaceState(null, "", location.pathname + location.search); };
    wrap.querySelector("#adminClose").onclick = close;
    wrap.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      if (loggedIn) { store.del(ADMIN_KEY); location.replace(location.pathname + location.search); return; }
      const code = wrap.querySelector("#adminCode").value;
      const { data, error } = await sb.rpc("check_admin", { p_code: code });
      if (error) { wrap.querySelector("#adminMsg").textContent = "서버에 연결하지 못했습니다. 설정을 확인해 주세요."; return; }
      if (data !== true) { wrap.querySelector("#adminMsg").textContent = "비밀번호가 맞지 않습니다."; return; }
      store.set(ADMIN_KEY, code); location.replace(location.pathname + location.search);
    };
  }
  const checkHash = () => { if (location.hash === "#admin") (document.readyState === "loading" ? addEventListener("DOMContentLoaded", adminBox) : adminBox()); };
  checkHash(); addEventListener("hashchange", checkHash);
})();

</script>
